<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>365 Motivos para Te Amar</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fdfbf7, #f4ecd8);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a4a4a;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(139, 94, 60, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 200, 170, 0.4);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            color: #b85d34;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
        }

        .pot-container {
            position: relative;
            cursor: pointer;
            margin: 0 auto 20px auto;
            width: 240px;
            height: 250px;
            transition: transform 0.3s ease;
        }

        .pot-container:hover {
            transform: scale(1.03);
        }

        /* ESTA É A LINHA DO SEU POTE NO HTML */
        .pot-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.1));
        }

        .btn-draw {
            background: #d48364;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 131, 100, 0.35);
            transition: background 0.2s, transform 0.2s;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-draw:hover {
            background: #bd6d4e;
            transform: translateY(-2px);
        }

        .note-card {
            background: #fffef9;
            border-left: 4px solid #d48364;
            border-top: 1px solid #f0ead6;
            border-right: 1px solid #f0ead6;
            border-bottom: 1px solid #f0ead6;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease-in-out;
            position: relative;
        }

        .note-card.hidden {
            display: none;
        }

        .note-number {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b85d34;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .note-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.65rem;
            color: #333;
            line-height: 1.35;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Nosso Pote de Amor</h1>
        <p class="subtitle">Toque no pote para abrir um bilhetinho especial de hoje.</p>

        <!-- AQUI ESTÁ A TAG DA IMAGEM DO SEU POTE -->
        <div class="pot-container" onclick="tirarRecado()" title="Clique para puxar um recado!">
            <img src="pote.jpg" alt="Pote de Mel" class="pot-image">
        </div>

        <button class="btn-draw" onclick="tirarRecado()">💌 Puxar Recadinho</button>

        <div id="noteCard" class="note-card hidden">
            <div class="note-number" id="noteNumber">Motivo #00</div>
            <div class="note-text" id="noteText">Aqui vai aparecer o texto do bilhete...</div>
        </div>
    </div>

    <footer>Feito com todo o carinho ❤️</footer>

    <script>
        let motivos = [];

        // Carrega os recadinhos do arquivo JSON automaticamente
        fetch('motivos.json')
            .then(response => response.json())
            .then(data => {
                motivos = data;
            })
            .catch(error => console.error('Erro ao carregar motivos:', error));

        function tirarRecado() {
            if (motivos.length === 0) {
                alert('Carregando os recadinhos... Tente novamente em um instante!');
                return;
            }

            const randomIndex = Math.floor(Math.random() * motivos.length);
            const recado = motivos[randomIndex];

            const card = document.getElementById('noteCard');
            const numElement = document.getElementById('noteNumber');
            const textElement = document.getElementById('noteText');

            card.classList.add('hidden');

            setTimeout(() => {
                numElement.innerText = `Motivo #${recado.id}`;
                textElement.innerText = `"${recado.texto}"`;
                card.classList.remove('hidden');
            }, 100);
        }
    </script>
</body>

</html>
